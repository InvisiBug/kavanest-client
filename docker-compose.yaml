version: "3.1"

services:
  kavanest-client:
    container_name: kavanest-client
    image: kavanest-client
    build:
      context: .
      dockerfile: Dockerfile.argo.live
    ports:
      - 3000:80

    networks:
      - proxynet
    environment:
      - API=http://api.kavanet.io
      - MQTT=mqtt://kavanet.io

networks:
  proxynet:
    name: kavanest-devnet
    external: true
