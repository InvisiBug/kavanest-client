httpRoute:
  name: client.kavanet.io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: client.kavanet.io
  path: /
  serviceName: kavanest-client
  servicePort: 80

service:
  name: kavanest-client
  selector: kavanest-client
  port: 80
  targetPort: 80
